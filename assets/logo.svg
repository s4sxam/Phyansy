<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#667eea" flood-opacity="0.35"/>
    </filter>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#764ba2" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#ringGrad)" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.5"/>

  <g filter="url(#glow)" transform="translate(100,100)">
    <circle cx="0" cy="0" r="10" fill="url(#grad1)" opacity="0.95"/>
    <circle cx="0" cy="0" r="5" fill="white" opacity="0.25"/>
    <line x1="0" y1="-18" x2="0" y2="-38" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="0" y2="38" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-18" y1="0" x2="-38" y2="0" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="18" y1="0" x2="38" y2="0" stroke="url(#grad1)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12.7" y1="-12.7" x2="26.9" y2="-26.9" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="12.7" y1="12.7" x2="26.9" y2="26.9" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="-12.7" y1="-12.7" x2="-26.9" y2="-26.9" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <line x1="-12.7" y1="12.7" x2="-26.9" y2="26.9" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <circle cx="0" cy="-41" r="2.5" fill="#667eea" opacity="0.9"/>
    <circle cx="0" cy="41" r="2.5" fill="#667eea" opacity="0.9"/>
    <circle cx="-41" cy="0" r="2.5" fill="#764ba2" opacity="0.9"/>
    <circle cx="41" cy="0" r="2.5" fill="#764ba2" opacity="0.9"/>
    <circle cx="29.7" cy="-29.7" r="1.8" fill="#667eea" opacity="0.7"/>
    <circle cx="-29.7" cy="-29.7" r="1.8" fill="#667eea" opacity="0.7"/>
    <circle cx="29.7" cy="29.7" r="1.8" fill="#764ba2" opacity="0.7"/>
    <circle cx="-29.7" cy="29.7" r="1.8" fill="#764ba2" opacity="0.7"/>
  </g>

  <text x="100" y="163" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" letter-spacing="3.5" fill="url(#grad1)" opacity="0.95">PHYANSY</text>
  <text x="100" y="178" text-anchor="middle" font-family="Georgia, serif" font-size="7.5" letter-spacing="2" fill="#9ca3af" opacity="0.7">PHYSICS REFERENCE</text>
</svg>
