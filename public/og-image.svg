<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>

    <!-- Left panel subtle radial glow -->
    <radialGradient id="leftGlow" cx="25%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1e2a4a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>

    <!-- Purple glow behind "Phyansy" text -->
    <radialGradient id="textGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e2d4a" stroke-width="0.5" opacity="0.5"/>
    </pattern>

    <!-- Divider vertical line gradient -->
    <linearGradient id="divLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3a5c" stop-opacity="0"/>
      <stop offset="30%" stop-color="#2a3a5c" stop-opacity="1"/>
      <stop offset="70%" stop-color="#2a3a5c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2a3a5c" stop-opacity="0"/>
    </linearGradient>

    <!-- Wave path clip -->
    <clipPath id="waveClip">
      <rect width="1200" height="630"/>
    </clipPath>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161d2e"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Icon backgrounds -->
    <linearGradient id="iconBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f2040"/>
    </linearGradient>
    <linearGradient id="iconWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2f50"/>
      <stop offset="100%" stop-color="#0f1f38"/>
    </linearGradient>
    <linearGradient id="iconMag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1a3f"/>
      <stop offset="100%" stop-color="#1a0f28"/>
    </linearGradient>
    <linearGradient id="iconFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1a0f"/>
      <stop offset="100%" stop-color="#1a0f08"/>
    </linearGradient>
    <linearGradient id="iconTele" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
  </defs>

  <!-- ═══ BACKGROUND ═══ -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="860" height="630" fill="url(#leftGlow)"/>

  <!-- ═══ VERTICAL DIVIDER ═══ -->
  <line x1="860" y1="0" x2="860" y2="630" stroke="url(#divLine)" stroke-width="1"/>

  <!-- ═══ WAVE DECORATION (bottom) ═══ -->
  <g clip-path="url(#waveClip)" opacity="0.6">
    <path d="M0 590 Q150 570 300 585 Q450 600 600 580 Q750 560 900 578 Q1050 596 1200 574 L1200 630 L0 630 Z"
          fill="none" stroke="#3b4fd8" stroke-width="1.5" opacity="0.5"/>
    <path d="M0 600 Q200 582 400 598 Q600 614 800 594 Q1000 574 1200 592 L1200 630 L0 630 Z"
          fill="none" stroke="#5b6ef0" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- ═══ LEFT PANEL ═══ -->

  <!-- Atom icon -->
  <g transform="translate(68, 55)">
    <!-- Outer glow circle -->
    <circle cx="42" cy="42" r="42" fill="#1a1f35" opacity="0.8"/>
    <circle cx="42" cy="42" r="38" fill="#141824"/>
    <!-- Atom nucleus -->
    <circle cx="42" cy="42" r="7" fill="#667eea" opacity="0.9"/>
    <!-- Orbit ellipses -->
    <ellipse cx="42" cy="42" rx="32" ry="13" fill="none" stroke="#667eea" stroke-width="2" opacity="0.8"/>
    <ellipse cx="42" cy="42" rx="32" ry="13" fill="none" stroke="#764ba2" stroke-width="2" opacity="0.7"
             transform="rotate(60 42 42)"/>
    <ellipse cx="42" cy="42" rx="32" ry="13" fill="none" stroke="#667eea" stroke-width="2" opacity="0.6"
             transform="rotate(120 42 42)"/>
  </g>

  <!-- FREE PHYSICS REFERENCE badge -->
  <rect x="68" y="175" width="230" height="34" rx="17" fill="#1a2540" stroke="#2a3a60" stroke-width="1"/>
  <circle cx="90" cy="192" r="5" fill="#4f7ef8"/>
  <text x="103" y="197" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="13" font-weight="600"
        fill="#7aa2f7" letter-spacing="1.5">FREE PHYSICS REFERENCE</text>

  <!-- Phyansy title glow -->
  <ellipse cx="260" cy="318" rx="280" ry="70" fill="url(#textGlow)"/>

  <!-- Phyansy title -->
  <text x="68" y="335" font-family="'SF Pro Display', 'Inter', 'Segoe UI', sans-serif"
        font-size="112" font-weight="700" letter-spacing="-3">
    <tspan fill="#c4b5fd">Phy</tspan><tspan fill="#a78bfa">ansy</tspan>
  </text>

  <!-- Subtitle -->
  <text x="70" y="378" font-family="'SF Pro Display', 'Inter', sans-serif" font-size="24"
        font-weight="400" fill="#64748b" letter-spacing="0.3">Interactive Physics Reference</text>

  <!-- Feature pills row 1 -->
  <g transform="translate(68, 410)">
    <!-- 80+ Constants -->
    <rect x="0" y="0" width="162" height="36" rx="8" fill="none" stroke="#1e2d4a" stroke-width="1.5"/>
    <text x="14" y="22" font-family="monospace" font-size="14" fill="#475569">▦</text>
    <text x="34" y="23" font-family="'SF Pro Display', sans-serif" font-size="13" fill="#94a3b8" font-weight="500">80+ Constants</text>

    <!-- 290+ Equations -->
    <rect x="174" y="0" width="168" height="36" rx="8" fill="none" stroke="#1e2d4a" stroke-width="1.5"/>
    <text x="188" y="22" font-family="monospace" font-size="15" fill="#475569">Σ</text>
    <text x="208" y="23" font-family="'SF Pro Display', sans-serif" font-size="13" fill="#94a3b8" font-weight="500">290+ Equations</text>

    <!-- SI Units -->
    <rect x="354" y="0" width="106" height="36" rx="8" fill="none" stroke="#1e2d4a" stroke-width="1.5"/>
    <text x="368" y="22" font-family="monospace" font-size="13" fill="#475569">✎</text>
    <text x="386" y="23" font-family="'SF Pro Display', sans-serif" font-size="13" fill="#94a3b8" font-weight="500">SI Units</text>

    <!-- Greek Symbols -->
    <rect x="472" y="0" width="148" height="36" rx="8" fill="none" stroke="#1e2d4a" stroke-width="1.5"/>
    <text x="486" y="23" font-family="serif" font-size="15" fill="#475569">Ω</text>
    <text x="506" y="23" font-family="'SF Pro Display', sans-serif" font-size="13" fill="#94a3b8" font-weight="500">Greek Symbols</text>
  </g>

  <!-- Feature pills row 2 -->
  <g transform="translate(68, 458)">
    <rect x="0" y="0" width="130" height="36" rx="8" fill="none" stroke="#1e2d4a" stroke-width="1.5"/>
    <text x="14" y="22" font-family="monospace" font-size="13" fill="#475569">▦</text>
    <text x="34" y="23" font-family="'SF Pro Display', sans-serif" font-size="13" fill="#94a3b8" font-weight="500">Calculator</text>
  </g>

  <!-- phyansy.app link -->
  <text x="70" y="558" font-family="'SF Pro Display', 'Courier New', monospace" font-size="18"
        fill="#4f7ef8" font-weight="500">phyansy.app</text>

  <!-- Bottom badges -->
  <g transform="translate(68, 578)">
    <!-- FREE -->
    <rect x="0" y="0" width="72" height="36" rx="8" fill="#4338ca"/>
    <text x="36" y="23" font-family="'SF Pro Display', sans-serif" font-size="13" font-weight="700"
          fill="white" text-anchor="middle">FREE</text>

    <!-- Open Source -->
    <rect x="84" y="0" width="210" height="36" rx="8" fill="none" stroke="#1e2d4a" stroke-width="1.5"/>
    <text x="104" y="22" font-family="monospace" font-size="13" fill="#475569">&lt;/&gt;</text>
    <text x="130" y="23" font-family="'SF Pro Display', sans-serif" font-size="12" fill="#94a3b8">Open Source · MIT License</text>

    <!-- No Login -->
    <rect x="306" y="0" width="178" height="36" rx="8" fill="none" stroke="#1e2d4a" stroke-width="1.5"/>
    <text x="320" y="22" font-family="monospace" font-size="13" fill="#475569">⊕</text>
    <text x="342" y="23" font-family="'SF Pro Display', sans-serif" font-size="12" fill="#94a3b8">No Login · No Ads</text>
  </g>

  <!-- ═══ RIGHT PANEL — Equation Cards ═══ -->

  <!-- Card 1: MASS-ENERGY -->
  <rect x="886" y="42" width="290" height="88" rx="14" fill="url(#cardGrad)" stroke="#1e2d4a" stroke-width="1"/>
  <!-- Icon box -->
  <rect x="902" y="58" width="52" height="52" rx="10" fill="url(#iconBolt)"/>
  <text x="928" y="93" text-anchor="middle" font-size="26">⚡</text>
  <!-- Label -->
  <text x="966" y="76" font-family="'SF Pro Display', sans-serif" font-size="11" font-weight="700"
        fill="#4f7ef8" letter-spacing="1.5">MASS–ENERGY</text>
  <!-- Formula -->
  <text x="966" y="104" font-family="'Courier New', monospace" font-size="22" fill="#e2e8f0" font-weight="500">E = mc²</text>

  <!-- Card 2: SCHRÖDINGER -->
  <rect x="886" y="150" width="290" height="88" rx="14" fill="url(#cardGrad)" stroke="#1e2d4a" stroke-width="1"/>
  <rect x="902" y="166" width="52" height="52" rx="10" fill="url(#iconWave)"/>
  <text x="928" y="201" text-anchor="middle" font-size="26">🌊</text>
  <text x="966" y="184" font-family="'SF Pro Display', sans-serif" font-size="11" font-weight="700"
        fill="#4f7ef8" letter-spacing="1.5">SCHRÖDINGER</text>
  <text x="966" y="212" font-family="'Courier New', monospace" font-size="20" fill="#e2e8f0">iℏ ∂ψ/∂t = Ĥψ</text>

  <!-- Card 3: MAXWELL — GAUSS -->
  <rect x="886" y="258" width="290" height="88" rx="14" fill="url(#cardGrad)" stroke="#1e2d4a" stroke-width="1"/>
  <rect x="902" y="274" width="52" height="52" rx="10" fill="url(#iconMag)"/>
  <text x="928" y="309" text-anchor="middle" font-size="26">🧲</text>
  <text x="966" y="292" font-family="'SF Pro Display', sans-serif" font-size="11" font-weight="700"
        fill="#4f7ef8" letter-spacing="1.5">MAXWELL — GAUSS</text>
  <text x="966" y="320" font-family="'Courier New', monospace" font-size="20" fill="#e2e8f0">∇·E = ρ/ε₀</text>

  <!-- Card 4: ENTROPY -->
  <rect x="886" y="366" width="290" height="88" rx="14" fill="url(#cardGrad)" stroke="#1e2d4a" stroke-width="1"/>
  <rect x="902" y="382" width="52" height="52" rx="10" fill="url(#iconFire)"/>
  <text x="928" y="417" text-anchor="middle" font-size="26">🔥</text>
  <text x="966" y="400" font-family="'SF Pro Display', sans-serif" font-size="11" font-weight="700"
        fill="#4f7ef8" letter-spacing="1.5">ENTROPY</text>
  <text x="966" y="428" font-family="'Courier New', monospace" font-size="22" fill="#e2e8f0">S = k ln Ω</text>

  <!-- Card 5: UNCERTAINTY -->
  <rect x="886" y="474" width="290" height="88" rx="14" fill="url(#cardGrad)" stroke="#1e2d4a" stroke-width="1"/>
  <rect x="902" y="490" width="52" height="52" rx="10" fill="url(#iconTele)"/>
  <text x="928" y="525" text-anchor="middle" font-size="26">🔭</text>
  <text x="966" y="508" font-family="'SF Pro Display', sans-serif" font-size="11" font-weight="700"
        fill="#4f7ef8" letter-spacing="1.5">UNCERTAINTY</text>
  <text x="966" y="536" font-family="'Courier New', monospace" font-size="20" fill="#e2e8f0">ΔxΔp ≥ ℏ/2</text>

</svg>
